<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>묘한특허 — 팀 203040</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap">
<style>
:root{--navy:#141B4D;--card:#232F78;--yel:#F5C64B;--coral:#FF8A5B;--mint:#5BD6C0;--soft:#AEB6E0;--red:#E0525A;--line:#4A56A0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0B1033;overflow:hidden;font-family:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:#fff}
.viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.stage{flex:none;width:1280px;height:720px;position:relative;transform-origin:center center;border-radius:14px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.slide{position:absolute;inset:0;padding:48px 76px;opacity:0;visibility:hidden;transition:opacity .45s ease;
  background:radial-gradient(1200px 600px at 50% 110%,#1E2869 0%,transparent 60%),linear-gradient(180deg,#0C1236 0%,#1E2869 100%)}
.slide.on{opacity:1;visibility:visible}
.stars{position:absolute;inset:0;pointer-events:none}
.hills{position:absolute;left:0;right:0;bottom:0;height:90px;pointer-events:none}
.moon{position:absolute;right:120px;top:40px;width:64px;height:64px;border-radius:50%;background:#FAD66E;box-shadow:0 0 40px rgba(245,198,75,.45)}
.moon::after{content:"";position:absolute;left:18px;top:-10px;width:64px;height:64px;border-radius:50%;background:#121A48}
.tag{display:inline-block;background:var(--yel);color:var(--navy);font-weight:700;font-size:15px;padding:7px 22px;border-radius:99px;position:relative;z-index:1}
.pno{position:absolute;right:52px;top:48px;font-size:28px;font-weight:900;color:var(--soft);z-index:1}
h2{margin:28px 0 0;font-size:40px;font-weight:900;letter-spacing:-.5px;position:relative;z-index:1}
.content{position:relative;z-index:1}
/* 1 team */
.team{display:flex;justify-content:center;gap:110px;margin-top:70px}
.age{display:flex;flex-direction:column;align-items:center}
.age-cat{width:112px;height:112px;margin-bottom:-24px;position:relative;z-index:2}
.age-disc{width:240px;height:240px;border-radius:50%;border:5px solid #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--navy)}
.age-disc b{font-size:92px;font-weight:900;line-height:1}
.age-disc span{font-size:22px;font-weight:700;margin-top:4px}
/* 2 concept */
.concept{display:flex;justify-content:space-between;align-items:center;margin-top:34px}
.sub{font-size:22px;color:var(--soft);margin:0 0 14px}
.big{font-size:66px;font-weight:900;line-height:1.18;margin:0}
.big em{font-style:normal;color:var(--yel)}
.stamps{display:flex;align-items:center;gap:30px;margin-top:40px}
.stamp{width:130px;height:130px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;font-size:22px;line-height:1.25}
.stamp.ok{border:5px solid var(--red);color:var(--red);transform:rotate(-12deg)}
.stamp.no{border:4px dashed var(--soft);color:var(--soft);transform:rotate(10deg)}
.vs-t{font-size:28px;font-weight:700;color:var(--soft)}
.hero{position:relative;width:390px;height:390px;border-radius:50%;background:#2B388C;border:4px solid var(--yel);display:flex;align-items:center;justify-content:center;margin-right:10px}
.hero .main{width:300px;height:300px}
.hero .rat{position:absolute;right:-20px;bottom:-10px;width:120px;height:120px}
/* 3 game */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px;margin-top:40px}
.card{background:var(--card);border-radius:24px;padding:26px 28px 24px;height:400px;display:flex;flex-direction:column;box-shadow:0 8px 24px rgba(0,0,0,.28)}
.pics{height:210px;display:grid;align-content:center}
.pics.c6{grid-template-columns:repeat(3,1fr);gap:4px 6px}
.pics.c4{grid-template-columns:repeat(2,1fr);gap:4px 20px;justify-items:center}
.pics .g{width:100%;max-width:100px}
.pics.c4 .g{max-width:100px}
.mergebox{height:210px;display:flex;align-items:center;justify-content:center;gap:4px;position:relative}
.mergebox .m{width:54px;height:54px}
.mergebox .arrow{color:var(--mint);font-size:34px;font-weight:900;margin:0 6px}
.mergebox .l3{width:124px;height:124px}
.lv{position:absolute;right:4px;top:18px;background:var(--mint);color:var(--navy);font-weight:900;font-size:14px;padding:3px 10px;border-radius:6px}
.num{margin-top:auto;font-weight:900;line-height:1}
.num b{font-size:82px}
.num span{font-size:26px;margin-left:10px}
.lbl{font-size:22px;font-weight:700;margin-top:10px}
/* 4 rounds */
.track{margin-top:40px;background:var(--card);border-radius:24px;padding:26px 40px 22px;box-shadow:0 8px 24px rgba(0,0,0,.28);position:relative}
.rounds{display:flex;justify-content:space-between;position:relative}
.rounds::before{content:"";position:absolute;left:36px;right:36px;top:112px;border-top:3px dashed var(--line)}
.r{display:flex;flex-direction:column;align-items:center;width:72px;position:relative}
.vs{height:78px;display:flex;align-items:flex-end}
.vs img{width:56px;height:56px;margin:0 -8px}
.dot{width:68px;height:68px;border-radius:50%;background:var(--navy);border:2px solid var(--line);color:var(--soft);font-weight:900;font-size:20px;display:flex;align-items:center;justify-content:center;margin-top:0}
.r.duel .dot{background:var(--yel);border:3px solid #fff;color:var(--navy)}
.dl{height:26px;margin-top:10px;font-size:15px;font-weight:700;color:var(--yel);white-space:nowrap}
.pills{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px;margin-top:40px}
.pill{display:flex;align-items:center;gap:16px;height:72px;border-radius:99px;background:var(--card);padding:0 30px;font-size:21px;font-weight:700}
.pill i{width:26px;height:26px;border-radius:50%;flex:none}
/* nav */
.nav{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;z-index:10;background:rgba(12,18,54,.75);backdrop-filter:blur(6px);padding:8px 14px;border-radius:99px}
.nav button{width:44px;height:44px;border-radius:50%;border:0;background:#232F78;color:#fff;font-size:20px;cursor:pointer}
.nav button:hover{background:#2F3C92}
.nav button:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.dots{display:flex;gap:8px}
.dots span{width:10px;height:10px;border-radius:50%;background:#4A56A0;cursor:pointer}
.dots span.on{background:var(--yel);width:26px;border-radius:6px}
@media (prefers-reduced-motion:reduce){.slide{transition:none}}
</style>
</head>

<script>
(function(){
  var NS='http://www.w3.org/2000/svg';
  // stars (seeded so every slide looks the same)
  var seed=7; function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647;}
  var starData=[]; for(var i=0;i<90;i++) starData.push([rnd()*1280,rnd()*560,[1,1,1.5,1.5,2][Math.floor(rnd()*5)],.3+rnd()*.5]);
  document.querySelectorAll('[data-stars]').forEach(function(svg){
    svg.setAttribute('viewBox','0 0 1280 720');
    starData.forEach(function(s){var c=document.createElementNS(NS,'circle');c.setAttribute('cx',s[0]);c.setAttribute('cy',s[1]);c.setAttribute('r',s[2]);c.setAttribute('fill','#FFF0C8');c.setAttribute('opacity',s[3]);svg.appendChild(c);});
  });
  function hill(off,amp1,amp2,f){var d='M0 90';for(var x=0;x<=1280;x+=10){d+=' L'+x+' '+(off-amp1*Math.sin(x/f)-amp2*Math.sin(x/61));}return d+' L1280 90 Z';}
  document.querySelectorAll('[data-hills]').forEach(function(svg){
    [[48,14,8,170,'#0B1031'],[70,8,0,120,'#070B27']].forEach(function(h){var p=document.createElementNS(NS,'path');p.setAttribute('d',hill(h[0],h[1],h[2],h[3]));p.setAttribute('fill',h[4]);svg.appendChild(p);});
  });

  var slides=[].slice.call(document.querySelectorAll('.slide')), cur=0, dots=document.getElementById('dots');
  slides.forEach(function(_,i){var d=document.createElement('span');d.title=(i+1)+'페이지';d.onclick=function(){go(i)};dots.appendChild(d);});
  function go(n){cur=Math.max(0,Math.min(slides.length-1,n));slides.forEach(function(s,i){s.classList.toggle('on',i===cur)});[].forEach.call(dots.children,function(d,i){d.classList.toggle('on',i===cur)});}
  document.getElementById('prev').onclick=function(){go(cur-1)};
  document.getElementById('next').onclick=function(){go(cur+1)};
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();go(cur+1);}
    if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(cur-1);}
  });
  var sx=null; document.addEventListener('touchstart',function(e){sx=e.touches[0].clientX},{passive:true});
  document.addEventListener('touchend',function(e){if(sx===null)return;var dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>40)go(cur+(dx<0?1:-1));sx=null;});
  var stage=document.getElementById('stage');
  function fit(){var s=Math.min(window.innerWidth/1280,(window.innerHeight-80)/720);stage.style.transform='scale('+s+')';}
  window.addEventListener('resize',fit); fit(); go(0);
})();
